services:
  - type: web
    name: pune-festival-gallery-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://your-pune-festival-gallery.vercel.app
